<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garage Games Live</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="display-page">
  <main class="display-layout">
    <section class="display-current">
      <span class="eyebrow">NOW COMPETING</span>
      <h1 id="displayCompetitor">Garage Games 2026</h1>
      <div id="displayTimer" class="display-timer">5:00</div>
      <p id="displayProgress">Waiting for the next competitor</p>
      <div id="displayGames" class="display-game-list"></div>
    </section>
    <section class="display-leaders">
      <span class="eyebrow">LIVE LEADERBOARD</span>
      <h2>Top competitors</h2>
      <ol id="displayLeaderboard"></ol>
    </section>
  </main>
  <script src="/display.js"></script>
</body>
</html>
