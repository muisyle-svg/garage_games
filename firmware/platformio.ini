[platformio]
default_envs = master, station_standard, station_prompt_demo
src_dir = src
test_dir = test

[esp32]
platform = espressif32@^6.10.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
  -D GG_FIRMWARE_VERSION=\"0.1.0\"
  -D CORE_DEBUG_LEVEL=1

[env:master]
platform = ${esp32.platform}
board = ${esp32.board}
framework = ${esp32.framework}
monitor_speed = ${esp32.monitor_speed}
lib_ldf_mode = ${esp32.lib_ldf_mode}
build_src_filter = +<master/> -<station_standard/> -<station_prompt_demo/>
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
  gilmaimon/ArduinoWebsockets@^0.5.4
  tzapu/WiFiManager@^2.0.17
  smougenot/TM1637
build_flags =
  ${esp32.build_flags}
  -D GG_ROLE_MASTER

[env:station_standard]
platform = ${esp32.platform}
board = ${esp32.board}
framework = ${esp32.framework}
monitor_speed = ${esp32.monitor_speed}
lib_ldf_mode = ${esp32.lib_ldf_mode}
build_src_filter = -<master/> +<station_standard/> -<station_prompt_demo/>
build_flags =
  ${esp32.build_flags}
  -D GG_ROLE_STATION
  -D GG_STATION_MODULE=\"standard\"

[env:station_prompt_demo]
platform = ${esp32.platform}
board = ${esp32.board}
framework = ${esp32.framework}
monitor_speed = ${esp32.monitor_speed}
lib_ldf_mode = ${esp32.lib_ldf_mode}
build_src_filter = -<master/> -<station_standard/> +<station_prompt_demo/>
build_flags =
  ${esp32.build_flags}
  -D GG_ROLE_STATION
  -D GG_STATION_MODULE=\"prompt-demo\"

[env:native]
platform = native
test_framework = unity
build_src_filter =
lib_compat_mode = off
build_flags =
  -std=c++17
