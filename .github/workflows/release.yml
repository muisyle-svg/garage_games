name: Release packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore GarageGames.slnx --configfile NuGet.Config
      - run: dotnet run --project tests/GarageGames.V2.Tests/GarageGames.V2.Tests.csproj --configuration Release
      - run: dotnet publish src/GarageGames.V2/GarageGames.V2.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/win-x64
      - shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive publish\win-x64\* "release\garage-games-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive firmware\* "release\garage-games-firmware-$env:GITHUB_REF_NAME.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
