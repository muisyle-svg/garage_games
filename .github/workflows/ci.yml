name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore GarageGames.slnx --configfile NuGet.Config
      - run: dotnet build GarageGames.slnx --configuration Release --no-restore
      - run: dotnet run --project tests/GarageGames.V2.Tests/GarageGames.V2.Tests.csproj --configuration Release --no-build --no-restore
      - run: dotnet publish src/GarageGames.V2/GarageGames.V2.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/win-x64

  frontend-and-firmware-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/GarageGames.V2.Tests/
      - name: Reject likely committed secrets
        shell: bash
        run: |
          if grep -RIE --exclude-dir=.git --exclude='*.md' \
            '(password|wifi_pass|api_key|secret)[[:space:]]*[:=][[:space:]]*["'\''][^"'\'']{8,}' .; then
            echo "A likely credential was committed."
            exit 1
          fi
